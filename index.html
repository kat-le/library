<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
   
   <div class="header">
         <h1>My Library</h1>
    </div>
    <div class="container" id="container">
         
        <div class="card">
            <div class="add-card">            
                <button class="add-card-btn" command="show-modal" commandfor="dialog-form">
                    <div class="circle"></div>
                </button>
            </div>
            <dialog id="dialog-form">
                <p>Add A New Book!</p>
                <div class="form-container">
                    <form action="#" method="dialog">
                        <div class="form-item">
                            <label for="form-title">Book Title</label>
                            <input type="text" id="form-title" name="form-title" required/>
                        </div>
                        <div class="form-item">
                            <label for="form-author">Author</label>
                            <input type="text" id="form-author" name="form-author" required/>
                        </div>
                        <div class="form-item">
                            <label for="form-pages">Number of Pages</label> 
                            <input type="number" id="form-pages" name="form-pages"required/>
                        </div>
                        <div class="form-item">
                            <label>Read Status</label>
                            <div class="checkboxes">
                                <div>
                                    <label for="form-read">Read</label>
                                    <input type="radio" id="form-read" name="read-status" value="read" required/>
                                </div>
                                <div>
                                    <label for="form-not-read">Not Read</label>
                                    <input type="radio" id="form-not-read" name="read-status" value="not-read"/>
                                </div>
                            </div>
                        </div>
                        <div class="form-btns">
                            <button class="cancel" id="cancel" type="button">Cancel</button>
                            <button class="add" id="add" type="submit">Add</button>
                        </div>
                    </form>
                </div>
            </dialog>
        </div>
    </div>
</body>
</html>
